name: Pull request quality assurance

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check Docker for PostgreSQL Testcontainers
        run: docker info

      - name: Verify server with PostgreSQL Testcontainers and generate coverage
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload backend analysis files
        uses: actions/upload-artifact@v4
        with:
          name: backend-sonar-analysis
          retention-days: 1
          if-no-files-found: error
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/site/jacoco/jacoco.xml

  client:
    name: Frontend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run client unit tests
        run: pnpm test

      - name: Build client
        run: pnpm build

  sonar:
    name: SonarQube Cloud
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java for analysis
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Download backend analysis files
        uses: actions/download-artifact@v4
        with:
          name: backend-sonar-analysis
          path: backend/target

      - name: Verify backend analysis files
        run: |
          test -d backend/target/classes
          test -d backend/target/test-classes
          test -s backend/target/site/jacoco/jacoco.xml

      - name: Analyze code and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.java.jdkHome=${{ env.JAVA_HOME }}
