name: Pull request quality assurance

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run server unit tests
        run: mvn --batch-mode --no-transfer-progress -Dtest='*UnitTests' -Dsurefire.failIfNoSpecifiedTests=true test
      
      - name: Run server integration tests
        run: mvn --batch-mode --no-transfer-progress -Dtest='*IntegrationTests' -Dsurefire.failIfNoSpecifiedTests=true test

      - name: Run server system tests
        run: mvn --batch-mode --no-transfer-progress -Dtest='*SystemTests' -Dsurefire.failIfNoSpecifiedTests=true test

  client:
    name: Frontend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
