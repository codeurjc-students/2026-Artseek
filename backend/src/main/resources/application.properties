spring.application.name=artseek-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/artseek}
spring.datasource.username=${DB_USERNAME:artseek}
spring.datasource.password=${DB_PASSWORD:artseek_dev_password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
